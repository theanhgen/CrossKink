name: Deploy Pages

# CROSSKINK FORK: the automatic push trigger is removed on purpose.
# This deploys upstream's documentation site. In a fork it would try to claim
# crossink.dev (docs/CNAME, now deleted) — a domain this repo does not own —
# on any push touching docs/. Left dispatch-only so it is still runnable if
# this fork ever publishes a site of its own, which needs its own domain.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
